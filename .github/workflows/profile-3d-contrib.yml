name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Calendar unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Update 3D contribution calendar"
          # Pick up anything pushed while this job was running, then push
          git pull --rebase origin main
          git push origin HEAD:main
