name: Update profile (3D calendar + radar)

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours, so new pushes show up within a few hours
  push:
    branches: [main]
    paths: ["scripts/**"] # redraw straight away when the chart script changes
  workflow_dispatch: # "Run workflow" button for an instant update

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate radar charts
        run: python3 scripts/radar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib assets/skill-radar.svg assets/language-mix.svg
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit"
            exit 0
          fi
          git commit -m "Update 3D calendar and radar charts"
          # Pick up anything pushed while this job was running, then push
          git pull --rebase origin main
          git push origin HEAD:main
